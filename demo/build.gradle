plugins {
    id 'com.android.application'
}

android {
    namespace 'com.scsonic.qwenimage21.demo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.scsonic.qwenimage21.demo'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // A checked-in debug key, not each machine's own ~/.android/debug.keystore: every build (local or CI)
    // signs identically, so a newer APK from either source can update an older install in place instead of
    // failing with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
    signingConfigs {
        debug {
            storeFile file('../qwenimage21-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':qwenimage21')
}
